  schedule = "0 14 * * *"

[functions."scc-rfq-inbox"]
  timeout = 120
  schedule = "0 13,17,21,1 * * *"

[functions."scc-sba-import"]
  timeout = 30

[functions."send-rfq"]
  timeout = 30

[functions."navigator-ingest"]
  timeout = 900
  schedule = "0 9 * * *"