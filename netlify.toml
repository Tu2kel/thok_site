[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"

[functions."analyze-sols"]
  timeout = 120

# Schedule removed 2026-07-16 — this cron emailed vendors directly via the Gmail API,
# outside the Railway blaster's kill switch. Invoke by hand if the ingest is wanted.
[functions."gmail-ingest"]
  timeout = 120

[functions."scc-rfq-inbox"]
  timeout = 10

# Schedule removed 2026-07-16 — the inbox scan misparsed replies (130 new -> 0 quotes)
# and auto-scrubbed FSC lanes off vendor cards on that bad read. Invoke by hand if wanted.
[functions."scc-rfq-inbox-background"]

[functions."scc-sba-import"]
  timeout = 30

[functions."scc-usaspending"]
  timeout = 30

[functions."send-rfq"]
  timeout = 30

# Schedule removed 2026-07-16 — same reason as gmail-ingest above.
[functions."navigator-ingest"]
  timeout = 900

# Jobsite Build Lab is an unlisted product prototype, reachable only from the
# hidden trigger on thok.html. Keep it out of search results -- crawling stays
# allowed on purpose, because a robots.txt Disallow would stop crawlers from
# ever reading this directive.
[[headers]]
  for = "/buildlab/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/buildlab/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
