[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"

[functions."analyze-sols"]
  timeout = 120

# Schedule removed 2026-07-16 — this cron emailed vendors directly via the Gmail API,
# outside the Railway blaster's kill switch. Invoke by hand if the ingest is wanted.
[functions."gmail-ingest"]
  timeout = 120

[functions."scc-rfq-inbox"]
  timeout = 10

[functions."scc-rfq-inbox-background"]
  schedule = "0 15,18,21,0 * * 1-5"

[functions."scc-sba-import"]
  timeout = 30

[functions."scc-usaspending"]
  timeout = 30

[functions."send-rfq"]
  timeout = 30

# Schedule removed 2026-07-16 — same reason as gmail-ingest above.
[functions."navigator-ingest"]
  timeout = 900