<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin Calculator — Supply Chain Command</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --imperial-red: #2a000a;
        --metallic-black: #111012;
        --metallic-black-surface: #1a181b;
        --gold-solid: #c9a84c;
        --gold-gradient: linear-gradient(
          to bottom,
          #cf972d 22%,
          #f9f295 45%,
          #e0aa3e 50%,
          #b8860b 55%,
          #f9f295 78%
        );
        --gold-border: rgba(201, 168, 76, 0.2);
        --gold-dim: rgba(201, 168, 76, 0.45);
        --alabaster: #f5f0e8;
        --white-dim: rgba(245, 240, 232, 0.55);
        --green: #3a8e5d;
        --accent-green: #3dd68c;
      }

      html,
      body {
        height: 100%;
        background: var(--imperial-red);
        font-family: "Cormorant Garamond", Georgia, serif;
        color: var(--alabaster);
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 48px 24px 64px;
        min-height: 100vh;
        background:
          radial-gradient(
            ellipse at 20% 10%,
            rgba(80, 0, 20, 0.7) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 80% 90%,
            rgba(40, 0, 10, 0.9) 0%,
            transparent 55%
          ),
          var(--imperial-red);
      }

      /* ── Header ── */
      .header {
        text-align: center;
        margin-bottom: 40px;
      }

      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        font-weight: 300;
        letter-spacing: 0.25em;
        color: var(--gold-solid);
        text-transform: uppercase;
        margin-bottom: 10px;
        opacity: 0.8;
      }

      .title {
        font-family: "Cinzel", serif;
        font-size: 28px;
        font-weight: 600;
        background: var(--gold-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: 0.08em;
        line-height: 1.2;
      }

      .subtitle {
        font-family: "Cormorant Garamond", serif;
        font-size: 14px;
        font-style: italic;
        color: var(--white-dim);
        margin-top: 8px;
      }

      /* ── Card ── */
      .card {
        background: var(--metallic-black-surface);
        border: 1px solid var(--gold-border);
        border-radius: 4px;
        width: 100%;
        max-width: 640px;
        padding: 32px 36px;
        position: relative;
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: var(--gold-gradient);
        opacity: 0.6;
      }

      /* ── Input block ── */
      .input-block {
        margin-bottom: 36px;
      }

      .input-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold-solid);
        margin-bottom: 10px;
        display: block;
      }

      .input-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .currency-prefix {
        font-family: "Cinzel", serif;
        font-size: 22px;
        color: var(--gold-solid);
        line-height: 1;
      }

      input[type="text"] {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--gold-border);
        border-radius: 3px;
        color: var(--alabaster);
        font-family: "JetBrains Mono", monospace;
        font-size: 26px;
        font-weight: 300;
        padding: 10px 16px;
        width: 100%;
        outline: none;
        letter-spacing: 0.04em;
        transition: border-color 0.15s;
      }

      input[type="text"]:focus {
        border-color: var(--gold-solid);
      }

      input[type="text"]::placeholder {
        color: rgba(245, 240, 232, 0.2);
      }

      /* ── Divider ── */
      .divider {
        height: 1px;
        background: var(--gold-border);
        margin-bottom: 28px;
      }

      /* ── Mode badge ── */
      .mode-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .mode-badge {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 2px;
        border: 1px solid;
      }

      .mode-self {
        color: var(--accent-green);
        border-color: rgba(61, 214, 140, 0.3);
        background: rgba(61, 214, 140, 0.06);
      }

      .mode-fe {
        color: #7eb8f7;
        border-color: rgba(126, 184, 247, 0.3);
        background: rgba(126, 184, 247, 0.06);
      }

      .mode-label {
        font-family: "Cormorant Garamond", serif;
        font-size: 13px;
        font-style: italic;
        color: var(--white-dim);
      }

      /* ── Table ── */
      .tbl-wrap {
        width: 100%;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead th {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--gold-solid);
        padding: 0 0 12px;
        text-align: right;
        font-weight: 400;
        border-bottom: 1px solid var(--gold-border);
      }

      thead th:first-child {
        text-align: left;
      }

      tbody tr {
        border-bottom: 1px solid rgba(201, 168, 76, 0.08);
        transition: background 0.1s;
      }

      tbody tr:last-child {
        border-bottom: none;
      }
      tbody tr:hover {
        background: rgba(201, 168, 76, 0.04);
      }

      tbody td {
        padding: 13px 0;
        text-align: right;
        vertical-align: middle;
      }

      tbody td:first-child {
        text-align: left;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--gold-solid);
        letter-spacing: 0.05em;
      }

      .net-val {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        font-weight: 400;
      }

      .gross-val {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--white-dim);
        display: block;
      }

      .fee-val {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        color: rgba(231, 76, 60, 0.7);
        display: block;
      }

      /* Margin color tiers */
      .m20 {
        color: #7eb8f7;
      }
      .m25 {
        color: #a0d9a0;
      }
      .m30 {
        color: var(--accent-green);
      }
      .m35 {
        color: #f9f295;
      }
      .m40 {
        color: var(--gold-solid);
      }

      /* ── Self-funded override ── */
      .sf .net-val {
        font-size: 16px;
      }
      .sf .gross-val,
      .sf .fee-val {
        display: none;
      }

      /* ── Moonshot tag ── */
      .moonshot {
        font-family: "JetBrains Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--gold-solid);
        border: 1px solid var(--gold-border);
        border-radius: 2px;
        padding: 2px 6px;
        margin-left: 6px;
        vertical-align: middle;
        opacity: 0.8;
      }

      /* ── Empty state ── */
      .empty {
        text-align: center;
        padding: 32px 0 16px;
        font-family: "Cormorant Garamond", serif;
        font-size: 15px;
        font-style: italic;
        color: var(--white-dim);
      }

      /* ── Footer note ── */
      .footnote {
        margin-top: 20px;
        font-family: "JetBrains Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(201, 168, 76, 0.35);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <p class="eyebrow">Supply Chain Command</p>
      <h1 class="title">Margin Calculator</h1>
      <p class="subtitle">Net take-home at 20 / 25 / 30 / 35 / 40%</p>
    </div>

    <div class="card">
      <div class="input-block">
        <label class="input-label" for="amt">Contract Value</label>
        <div class="input-row">
          <span class="currency-prefix">$</span>
          <input
            type="text"
            id="amt"
            placeholder="0"
            autocomplete="off"
            inputmode="numeric"
          />
        </div>
      </div>

      <div class="divider"></div>

      <div class="mode-row">
        <span id="mode-badge" class="mode-badge mode-self">Self-Funded</span>
        <span id="mode-label" class="mode-label"
          >No FE fees &mdash; 20%+ target</span
        >
      </div>

      <div class="tbl-wrap" id="tbl-wrap">
        <div class="empty" id="empty-state">Enter a contract value above</div>
        <table id="results-table" style="display: none">
          <thead>
            <tr>
              <th>Margin</th>
              <th>Gross</th>
              <th>FE Fee</th>
              <th>Net Take-Home</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>

      <p class="footnote" id="footnote"></p>
    </div>

    <script>
      const FE_THRESHOLD = 10000;
      const FE_RATE = 0.05;
      const MARGINS = [0.2, 0.25, 0.3, 0.35, 0.4];
      const CLASSES = ["m20", "m25", "m30", "m35", "m40"];

      const input = document.getElementById("amt");
      const badge = document.getElementById("mode-badge");
      const modeLabel = document.getElementById("mode-label");
      const empty = document.getElementById("empty-state");
      const table = document.getElementById("results-table");
      const tbody = document.getElementById("results-body");
      const footnote = document.getElementById("footnote");

      function fmt(n) {
        if (n >= 1000000) return "$" + (n / 1000000).toFixed(2) + "M";
        if (n >= 1000) return "$" + (n / 1000).toFixed(1) + "K";
        return "$" + Math.round(n).toLocaleString();
      }

      function fmtFull(n) {
        return "$" + Math.round(n).toLocaleString();
      }

      function parseVal(str) {
        return parseFloat(str.replace(/[^0-9.]/g, "")) || 0;
      }

      function render(val) {
        if (!val || val <= 0) {
          empty.style.display = "block";
          table.style.display = "none";
          footnote.textContent = "";
          badge.className = "mode-badge mode-self";
          badge.textContent = "Self-Funded";
          modeLabel.textContent = "No FE fees — 20%+ target";
          return;
        }

        const fe = val > FE_THRESHOLD;
        const feeAmt = fe ? val * FE_RATE : 0;

        badge.className = "mode-badge " + (fe ? "mode-fe" : "mode-self");
        badge.textContent = fe ? "Factoring Express" : "Self-Funded";
        modeLabel.textContent = fe
          ? "FE Day-30 benchmark — 5.00% against contract value"
          : "No FE fees — 20%+ margin target";

        tbody.innerHTML = "";

        MARGINS.forEach((m, i) => {
          const gross = val * m;
          const net = gross - feeAmt;
          const netPct = ((net / val) * 100).toFixed(1);
          const isMoonshot = val >= 200000 && m >= 0.3;

          const tr = document.createElement("tr");
          if (!fe) tr.className = "sf";

          const moonHtml = isMoonshot
            ? '<span class="moonshot">Moonshot</span>'
            : "";

          tr.innerHTML = `
          <td>${Math.round(m * 100)}%${moonHtml}</td>
          <td><span class="gross-val">${fmtFull(gross)}</span></td>
          <td><span class="fee-val">- ${fmtFull(feeAmt)}</span></td>
          <td>
            <span class="net-val ${CLASSES[i]}">${fmtFull(net)}</span>
            ${fe ? '<span class="gross-val" style="display:block;">' + netPct + "% effective</span>" : ""}
          </td>
        `;
          tbody.appendChild(tr);
        });

        empty.style.display = "none";
        table.style.display = "table";

        if (fe) {
          footnote.textContent =
            "FE fee: " +
            fmtFull(feeAmt) +
            " flat against $" +
            Math.round(val).toLocaleString() +
            " · Day-30 · 2.50% factoring + 2.50% PO funding";
        } else {
          footnote.textContent =
            "Self-funded · no FE fees applied · 20%+ minimum target";
        }
      }

      input.addEventListener("input", () => {
        const raw = input.value;
        const val = parseVal(raw);
        render(val);
      });

      input.addEventListener("blur", () => {
        const val = parseVal(input.value);
        if (val > 0) {
          input.value = Math.round(val).toLocaleString();
        }
      });

      input.addEventListener("focus", () => {
        const val = parseVal(input.value);
        if (val > 0) input.value = Math.round(val);
      });
    </script>
  </body>
</html>
