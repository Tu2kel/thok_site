<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin Calculator — SCC</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: linear-gradient(
          160deg,
          #2a0010 0%,
          #180008 35%,
          #0e000a 65%,
          #120010 100%
        );
        color: #f5f0e8;
        font-family: "Cormorant Garamond", serif;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 32px 16px 48px;
      }

      .card {
        width: 100%;
        max-width: 500px;
        background: linear-gradient(
          160deg,
          #2e1020 0%,
          #1c0810 40%,
          #110008 100%
        );
        border: 1px solid rgba(201, 168, 76, 0.22);
        border-radius: 6px;
        padding: 28px 28px 32px;
        box-shadow:
          0 8px 48px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(201, 168, 76, 0.05) inset;
      }

      .eyebrow {
        font-family: "Cinzel", serif;
        font-size: 7.5px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(201, 168, 76, 0.45);
        margin-bottom: 6px;
        text-align: center;
      }

      h1 {
        font-family: "Cinzel", serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.06em;
        background: linear-gradient(
          to bottom,
          #cf972d 22%,
          #f9f295 45%,
          #e0aa3e 50%,
          #b8860b 55%,
          #f9f295 78%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-align: center;
        margin-bottom: 4px;
      }

      .subtitle {
        text-align: center;
        font-size: 12px;
        color: rgba(245, 240, 232, 0.35);
        font-style: italic;
        letter-spacing: 0.04em;
        margin-bottom: 24px;
      }

      /* ── INPUT ── */
      .input-section {
        margin-bottom: 20px;
      }

      .input-label {
        font-family: "Cinzel", serif;
        font-size: 8.5px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(201, 168, 76, 0.55);
        margin-bottom: 6px;
        display: block;
      }

      .input-wrap {
        display: flex;
        align-items: center;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(201, 168, 76, 0.2);
        border-radius: 4px;
        padding: 0 14px;
        transition: border-color 0.2s;
      }
      .input-wrap:focus-within {
        border-color: rgba(201, 168, 76, 0.55);
      }

      .dollar-sign {
        font-family: "Cinzel", serif;
        font-size: 15px;
        color: rgba(201, 168, 76, 0.5);
        margin-right: 6px;
        flex-shrink: 0;
      }

      input[type="number"] {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: #f5f0e8;
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        padding: 12px 0;
        width: 100%;
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
      }

      /* ── MODE TABS ── */
      .mode-tabs {
        display: flex;
        gap: 0;
        margin-bottom: 16px;
        border: 1px solid rgba(201, 168, 76, 0.18);
        border-radius: 4px;
        overflow: hidden;
      }

      .mode-tab {
        flex: 1;
        padding: 7px 10px;
        background: transparent;
        border: none;
        cursor: pointer;
        font-family: "Cinzel", serif;
        font-size: 8px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(245, 240, 232, 0.4);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .mode-tab:not(:last-child) {
        border-right: 1px solid rgba(201, 168, 76, 0.18);
      }
      .mode-tab.active {
        background: rgba(201, 168, 76, 0.12);
        color: #c9a84c;
      }

      .fe-note {
        text-align: right;
        font-size: 10px;
        color: rgba(245, 240, 232, 0.3);
        font-family: "Cinzel", serif;
        letter-spacing: 0.06em;
        margin-bottom: 10px;
      }

      /* ── TABLE ── */
      .table-wrap {
        border: 1px solid rgba(201, 168, 76, 0.12);
        border-radius: 4px;
        overflow: hidden;
      }

      .tbl-head {
        display: grid;
        grid-template-columns: 56px 1fr 72px 1fr;
        background: rgba(0, 0, 0, 0.3);
        border-bottom: 1px solid rgba(201, 168, 76, 0.12);
      }

      .tbl-head-cell {
        font-family: "Cinzel", serif;
        font-size: 7px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(201, 168, 76, 0.45);
        padding: 7px 10px;
      }
      .tbl-head-cell:not(:first-child) {
        border-left: 1px solid rgba(201, 168, 76, 0.07);
      }

      .tbl-row {
        display: grid;
        grid-template-columns: 56px 1fr 72px 1fr;
        border-bottom: 1px solid rgba(201, 168, 76, 0.06);
        transition: background 0.12s;
      }
      .tbl-row:last-child {
        border-bottom: none;
      }
      .tbl-row:hover {
        background: rgba(201, 168, 76, 0.04);
      }

      /* floor tier rows */
      .tbl-row.floor-row {
        opacity: 0.85;
      }

      .tbl-cell {
        padding: 9px 10px;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: rgba(245, 240, 232, 0.75);
        display: flex;
        align-items: center;
      }
      .tbl-cell:not(:first-child) {
        border-left: 1px solid rgba(201, 168, 76, 0.06);
      }

      .tbl-cell.margin-cell {
        font-family: "Cinzel", serif;
        font-size: 11px;
        letter-spacing: 0.05em;
        font-weight: 600;
      }

      .tbl-cell.gross-cell {
        color: rgba(245, 240, 232, 0.55);
      }

      .tbl-cell.fee-cell {
        color: rgba(231, 76, 60, 0.6);
        font-size: 12px;
      }

      .tbl-cell.net-cell {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .net-amount {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        font-weight: 600;
      }

      .net-eff {
        font-family: "Cinzel", serif;
        font-size: 8px;
        letter-spacing: 0.1em;
        color: rgba(245, 240, 232, 0.35);
      }

      .divider-row {
        height: 1px;
        background: rgba(201, 168, 76, 0.18);
        grid-column: span 4;
      }

      /* ── FE FOOTNOTE ── */
      .footnote {
        margin-top: 10px;
        font-size: 10px;
        color: rgba(245, 240, 232, 0.28);
        font-family: "JetBrains Mono", monospace;
        letter-spacing: 0.02em;
        line-height: 1.5;
        padding: 0 2px;
      }

      /* ── SELF-FUNDED BADGE ── */
      .self-badge {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 6px;
        border-radius: 10px;
        background: rgba(61, 214, 140, 0.12);
        border: 1px solid rgba(61, 214, 140, 0.25);
        font-family: "Cinzel", serif;
        font-size: 7px;
        letter-spacing: 0.12em;
        color: #3dd68c;
        text-transform: uppercase;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">Supply Chain Command</div>
      <h1>Margin Calculator</h1>
      <div class="subtitle" id="subtitle">
        Net take-home at 8 / 10 / 15 / 20 / 25 / 30 / 35 / 40%
      </div>

      <div class="input-section">
        <label class="input-label" for="cv">Contract Value</label>
        <div class="input-wrap">
          <span class="dollar-sign">$</span>
          <input
            type="number"
            id="cv"
            min="0"
            step="100"
            placeholder="0"
            value=""
          />
        </div>
      </div>

      <!-- Mode selector -->
      <div class="mode-tabs">
        <button
          class="mode-tab active"
          data-mode="fe-30"
          onclick="setMode('fe-30', this)"
        >
          FE Day-30
        </button>
        <button
          class="mode-tab"
          data-mode="fe-60"
          onclick="setMode('fe-60', this)"
        >
          FE Day-60
        </button>
        <button
          class="mode-tab"
          data-mode="self"
          onclick="setMode('self', this)"
        >
          Self-Funded
        </button>
      </div>

      <div class="fe-note" id="fe-note">
        FE Day-30 benchmark — 5.00% against contract value
      </div>

      <div class="table-wrap">
        <div class="tbl-head">
          <div class="tbl-head-cell">Margin</div>
          <div class="tbl-head-cell">Gross</div>
          <div class="tbl-head-cell">FE Fee</div>
          <div class="tbl-head-cell">Net Take-Home</div>
        </div>
        <div id="tbl-body"></div>
      </div>

      <div class="footnote" id="footnote"></div>
    </div>

    <script>
      // ── FE FEE ENGINE ─────────────────────────────────────────────────────
      // Factoring: 1.67% first 20d, +0.833% per extra 10d
      // PO Funding: 2.50% flat (applied when using PO funding)
      function calcFE(invoice, payDay, withPO) {
        let factorPct = 1.67;
        if (payDay > 20) {
          const extra = Math.ceil((payDay - 20) / 10);
          factorPct += extra * 0.833;
        }
        const factorFee = (invoice * factorPct) / 100;
        const poFee = withPO ? (invoice * 2.5) / 100 : 0;
        return {
          totalFee: factorFee + poFee,
          totalPct: factorPct + (withPO ? 2.5 : 0),
        };
      }

      // ── MODES ─────────────────────────────────────────────────────────────
      const MODES = {
        "fe-30": {
          label: "FE Day-30 benchmark — 5.00% against contract value",
          payDay: 30,
          withPO: true,
        },
        "fe-60": {
          label: "FE Day-60 worst-case — 7.50% against contract value",
          payDay: 60,
          withPO: true,
        },
        self: {
          label: "Self-funded — no FE fees",
          payDay: 0,
          withPO: false,
          selfFunded: true,
        },
      };

      const TIERS = [
        { pct: 0.08, label: "8%", color: "#e74c3c" },
        { pct: 0.1, label: "10%", color: "#e8874f" },
        { pct: 0.15, label: "15%", color: "#f0c040" },
        null, // divider — floor / standard break
        { pct: 0.2, label: "20%", color: "#7eb8f7" },
        { pct: 0.25, label: "25%", color: "#9ab8ff" },
        { pct: 0.3, label: "30%", color: "#C9A84C" },
        { pct: 0.35, label: "35%", color: "#3dd68c" },
        { pct: 0.4, label: "40%", color: "#a8e6cf" },
      ];

      let currentMode = "fe-30";

      function setMode(mode, btn) {
        currentMode = mode;
        document
          .querySelectorAll(".mode-tab")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        render();
      }

      function fmt(n) {
        return (
          "$" +
          Math.abs(n).toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          })
        );
      }

      function render() {
        const raw = document.getElementById("cv").value;
        const cv = parseFloat(raw) || 0;
        const mode = MODES[currentMode];

        document.getElementById("fe-note").textContent = mode.label;

        const body = document.getElementById("tbl-body");
        body.innerHTML = "";

        TIERS.forEach((tier) => {
          if (tier === null) {
            // divider
            const div = document.createElement("div");
            div.style.cssText = "height:1px;background:rgba(201,168,76,.18);";
            body.appendChild(div);
            return;
          }

          const gross = cv * tier.pct;
          let fee = 0;
          let feeLabel = "—";
          let netColor = tier.color;

          if (!mode.selfFunded && cv > 0) {
            const fe = calcFE(cv, mode.payDay, mode.withPO);
            fee = fe.totalFee;
            feeLabel = "−" + fmt(fee);
          }

          const net = gross - fee;
          const netPct = cv > 0 ? ((net / cv) * 100).toFixed(1) : "—";
          const isFloor = tier.pct <= 0.15;

          const row = document.createElement("div");
          row.className = "tbl-row" + (isFloor ? " floor-row" : "");

          const netClass = net >= 0 ? tier.color : "#e74c3c";

          row.innerHTML = `
          <div class="tbl-cell margin-cell" style="color:${tier.color}">${tier.label}</div>
          <div class="tbl-cell gross-cell">${cv > 0 ? fmt(gross) : "—"}</div>
          <div class="tbl-cell fee-cell">${cv > 0 ? feeLabel : "—"}</div>
          <div class="tbl-cell net-cell">
            <span class="net-amount" style="color:${cv > 0 ? netClass : "rgba(245,240,232,.3)"}">${cv > 0 ? fmt(net) : "—"}</span>
            <span class="net-eff">${cv > 0 && !mode.selfFunded ? netPct + "% effective" : cv > 0 ? tier.pct * 100 + ".0% effective" : ""}</span>
          </div>
        `;
          body.appendChild(row);
        });

        // Footnote
        const fn = document.getElementById("footnote");
        if (cv > 0 && !MODES[currentMode].selfFunded) {
          const m = MODES[currentMode];
          const fe = calcFE(cv, m.payDay, m.withPO);
          fn.textContent =
            `FE Fee: ${fmt(fe.totalFee)} flat against ${fmt(cv)} — Day-${m.payDay} ${fe.totalPct.toFixed(2)}% factoring` +
            (m.withPO ? " + 2.50% PO Funding" : "");
        } else {
          fn.textContent = "";
        }
      }

      document.getElementById("cv").addEventListener("input", render);
      render();
    </script>
  </body>
</html>
