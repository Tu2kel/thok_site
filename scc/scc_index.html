<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supply Chain Command — Imperio Talent Solutions</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../images/thok32.png"
    />

    <!-- ── FONTS ── -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <!-- ── DESIGN SYSTEM ── -->
    <link rel="stylesheet" href="styles/imperio.css" />

    <!-- ── SIDEBAR ── -->
    <style>
      #imp-sb {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 48px;
        background: linear-gradient(
          160deg,
          #f5f0e8 0%,
          #ece7db 25%,
          #e4ddd0 50%,
          #ece7db 75%,
          #f5f0e8 100%
        );
        border-right: 1px solid rgba(160, 110, 0, 0.2);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        z-index: 9999;
        transition: width 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
        box-shadow: 3px 0 16px rgba(120, 80, 0, 0.12);
      }
      #imp-sb.open {
        width: 194px;
      }

      /* Top-edge gloss line — matches metallic black surface treatment */
      #imp-sb::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(160, 110, 0, 0.15) 40%,
          rgba(160, 110, 0, 0.35) 50%,
          rgba(160, 110, 0, 0.15) 60%,
          transparent
        );
        pointer-events: none;
      }

      /* Toggle button */
      .sb-toggle {
        height: 52px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border-bottom: 1px solid rgba(160, 110, 0, 0.15);
        transition: background 0.18s;
        padding: 0 12px;
        gap: 10px;
      }
      .sb-toggle:hover {
        background: rgba(160, 110, 0, 0.08);
      }
      .sb-toggle-icon {
        font-size: 16px;
        flex-shrink: 0;
        width: 24px;
        text-align: center;
        background: linear-gradient(
          to bottom,
          #cf972d 22%,
          #f9f295 45%,
          #e0aa3e 50%,
          #b8860b 55%,
          #f9f295 78%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .sb-toggle-label {
        font-family: "Cinzel", serif;
        font-size: 8px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        background: linear-gradient(
          to bottom,
          #cf972d 22%,
          #f9f295 45%,
          #e0aa3e 50%,
          #b8860b 55%,
          #f9f295 78%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.12s;
      }
      #imp-sb.open .sb-toggle-label {
        opacity: 1;
        transition: opacity 0.18s 0.08s;
      }

      /* Section label */
      .sb-sec-label {
        font-family: "Cinzel", serif;
        font-size: 7px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(120, 80, 0, 0.55);
        white-space: nowrap;
        padding: 12px 12px 5px;
        display: block;
        opacity: 0;
        transition: opacity 0.12s;
      }
      #imp-sb.open .sb-sec-label {
        opacity: 1;
        transition: opacity 0.18s 0.06s;
      }

      .sb-divider {
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(160, 110, 0, 0.2) 30%,
          rgba(160, 110, 0, 0.2) 70%,
          transparent
        );
        margin: 6px 0;
      }

      /* Nav links */
      .sb-link {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 12px;
        text-decoration: none;
        border-left: 2px solid transparent;
        transition:
          background 0.15s,
          border-color 0.15s;
        white-space: nowrap;
        position: relative;
      }
      .sb-link:hover {
        background: rgba(160, 110, 0, 0.06);
        border-left-color: rgba(120, 80, 0, 0.45);
      }
      .sb-link-icon {
        width: 24px;
        flex-shrink: 0;
        text-align: center;
        font-size: 13px;
        color: #7a5000;
      }
      .sb-link-text {
        font-family: "Cinzel", serif;
        font-size: 9.5px;
        letter-spacing: 0.1em;
        background: linear-gradient(
          to bottom,
          #5a3800 0%,
          #7a5000 40%,
          #5a3800 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        opacity: 0;
        transition: opacity 0.12s;
      }
      #imp-sb.open .sb-link-text {
        opacity: 1;
        transition: opacity 0.18s 0.06s;
      }

      /* Tooltip when collapsed */
      #imp-sb:not(.open) .sb-link::after {
        content: attr(data-tip);
        position: absolute;
        left: 52px;
        top: 50%;
        transform: translateY(-50%);
        background: linear-gradient(160deg, #f5f0e8 0%, #e8e1d4 100%);
        border: 1px solid rgba(120, 80, 0, 0.3);
        font-family: "Cinzel", serif;
        font-size: 9px;
        letter-spacing: 0.1em;
        color: #5a3800;
        padding: 5px 12px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        z-index: 99999;
      }
      #imp-sb:not(.open) .sb-link:hover::after {
        opacity: 1;
      }

      /* Push app body right */
      body {
        padding-left: 48px;
        transition: padding-left 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      }
      body.sb-open {
        padding-left: 194px;
      }
    </style>

    <!-- ── TESSERACT + XLSX (for FU Engine tab) ── -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- ── REACT (production — no Babel, no JSX transformer) ── -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  </head>
  <body>
    <!-- ══ IMPERIO SIDEBAR — Ecosystem Launcher ══ -->

      <a

      <a
        class="sb-link"

        <span class="sb-link-text">NSN Lookup</span>
      </a>

      <div class="sb-divider"></div>

      <!-- Imperio Network -->
      <span class="sb-sec-label">Imperio Network</span>

      <a
        class="sb-link"
        href="https://thehouseofkel.com"
        target="_blank"
        rel="noopener"
        data-tip="Brand Site"
      >
        <span class="sb-link-icon">🏛</span>
        <span class="sb-link-text">Brand Site</span>

      <a
        class="sb-link"
        href="https://ifl-service-contract.netlify.app"
        target="_blank"
        rel="noopener"
        data-tip="Service Contracts"
      >
        <span class="sb-link-icon">📋</span>
        <span class="sb-link-text">Service Contracts</span>
      </a>

      <a
        class="sb-link"
        href="https://thehouseofkel.com/contractors"
        target="_blank"
        rel="noopener"
        data-tip="Contractors"
      >
        <span class="sb-link-icon">🎖</span>
        <span class="sb-link-text">Contractors</span>
      </a>

      <a
        class="sb-link"
        href="https://thehouseofkel.com/employers"
        target="_blank"
        rel="noopener"
        data-tip="Employers"
      >
        <span class="sb-link-icon">🏢</span>
        <span class="sb-link-text">Employers</span>
      </a>
    </nav>

    <script>
      function sbToggle() {
        const sb = document.getElementById("imp-sb");
        const open = sb.classList.toggle("open");
        document.body.classList.toggle("sb-open", open);
        localStorage.setItem("imp-sb-open", open ? "1" : "0");
      }
      (function () {
        if (localStorage.getItem("imp-sb-open") === "1") {
          document.getElementById("imp-sb").classList.add("open");
          document.body.classList.add("sb-open");
        }
      })();
    </script>

    <!-- React mounts here -->
    <!-- ══ THOK WATERMARK — outside React, no stacking context issues ══ -->
    <div
      id="thok-watermark"
      style="
        display: none;
        position: fixed;
        top: 100px;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: url(assets/thok_logo.png);
        background-repeat: no-repeat;
        background-position: center center;
        background-size: 860px 860px;
        opacity: 0.09;
        pointer-events: none;
        z-index: 9998;
      "
    ></div>

    <div id="root"></div>

    <!--
    ══════════════════════════════════════════════════════════════════════
    LOAD ORDER — all files are siblings in the same flat folder.
    Each exposes its API on a window.SCC_* namespace.
    app.js must be LAST — it destructures all other namespaces.

    Folder layout (scc/):
      index.html
      margin-calc.html
      assets/     — logos, memo.html, supplier-po-template.html
      styles/     — imperio.css, memo.css
      core/       — db.js, db-nsn.js, bidmath.js, parser.js, distributors.js
      tabs/       — all React tab components + app.js (app.js must be last)
                    pipeline split: pipeline-vi.js → pipeline-drawer.js → pipeline-table.js
    ══════════════════════════════════════════════════════════════════════
  -->

    <!-- ── CORE LIBS (no dependencies on each other, load first) ── -->
    <script src="core/db.js"></script>
    <script src="core/bidmath.js"></script>
    <script src="core/parser.js"></script>
    <script src="core/distributors.js"></script>

    <!-- ── SOURCING ACTION BRIDGE ── -->

    <!-- ── REACT TAB COMPONENTS ── -->

    <script src="tabs/pipeline-drawer.js"></script>
    <script src="tabs/pipeline-table.js"></script>
    <script src="tabs/rfq.js"></script>
    <script src="tabs/awards.js"></script>
    <script src="tabs/memo.js"></script>
    <script src="tabs/fu.js"></script>
    <script src="tabs/esbd.js"></script>

    <!-- ── APP ROOT — must be last ── -->

    <script src="tabs/dibbs-tab.js"></script>

    <!-- ── MARGIN CALC OVERLAY ── -->
    <style>
      #mc-fab {
        position: fixed;
        bottom: 28px;
        right: 28px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(
          to bottom,
          #cf972d 22%,
          #f9f295 45%,
          #e0aa3e 50%,
          #b8860b 55%,
          #f9f295 78%
        );
        border: none;
        cursor: pointer;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Cinzel", serif;
        font-size: 18px;
        font-weight: 700;
        color: #2a000a;
        box-shadow: 0 2px 16px rgba(201, 168, 76, 0.35);
        transition:
          transform 0.15s,
          box-shadow 0.15s;
        user-select: none;
      }
      #mc-fab:hover {
        transform: scale(1.08);
        box-shadow: 0 4px 24px rgba(201, 168, 76, 0.5);
      }
      #mc-fab:active {
        transform: scale(0.96);
      }

      #mc-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(10, 0, 4, 0.72);
        backdrop-filter: blur(3px);
        align-items: center;
        justify-content: center;
      }
      #mc-overlay.open {
        display: flex;
      }

      #mc-panel {
        position: relative;
        width: min(680px, 94vw);
        max-height: 88vh;
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid rgba(201, 168, 76, 0.25);
        box-shadow: 0 8px 48px rgba(0, 0, 0, 0.7);
        animation: mcSlideUp 0.22s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes mcSlideUp {
        from {
          opacity: 0;
          transform: translateY(32px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      #mc-panel iframe {
        width: 100%;
        height: 88vh;
        border: none;
        display: block;
      }

      #mc-close {
        position: absolute;
        top: 10px;
        right: 12px;
        background: none;
        border: none;
        color: rgba(201, 168, 76, 0.6);
        font-size: 18px;
        cursor: pointer;
        z-index: 1;
        line-height: 1;
        padding: 4px 6px;
        transition: color 0.15s;
      }
      #mc-close:hover {
        color: #c9a84c;
      }
    </style>

    <button id="mc-fab" title="Margin Calculator">$</button>

    <div id="mc-overlay">
      <div id="mc-panel">
        <button id="mc-close" title="Close">✕</button>
        <iframe src="margin-calc.html" id="mc-frame"></iframe>
      </div>
    </div>

    <script>
      (function () {
        const fab = document.getElementById("mc-fab");
        const overlay = document.getElementById("mc-overlay");
        const close = document.getElementById("mc-close");

        function openCalc() {
          overlay.classList.add("open");
        }
        function closeCalc() {
          overlay.classList.remove("open");
        }

        fab.addEventListener("click", openCalc);
        close.addEventListener("click", closeCalc);
        overlay.addEventListener("click", function (e) {
          if (e.target === overlay) closeCalc();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closeCalc();
        });
      })();
    </script>
    <script src="tabs/scc-chat.js"></script>
  </body>
</html>
