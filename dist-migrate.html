      }

        padding: 14px;
        background: var(--gold-gradient);
        border: none;
        border-radius: 2px;
        font-family: "Cinzel", serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #1a0005;
        cursor: pointer;
        transition:

          transform 0.2s;
      }
      .btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

        margin-top: 24px;
        background: rgba(0, 0, 0, 0.4);

        border-radius: 2px;
        padding: 16px;
        font-size: 13px;
        line-height: 2;
        display: none;
        max-height: 280px;

      function lg(msg, cls) {
        const el = document.getElementById("log");
        el.classList.add("on");
        const d = document.createElement("div");
        d.className = cls;
        d.textContent = msg;
        el.appendChild(d);
        el.scrollTop = el.scrollHeight;
      }

      async function run() {
        const base = document
          .getElementById("baseUrl")
          .value.trim()
          .replace(/\/$/, "");
        if (!base) {
          lg("Enter the Netlify base URL.", "err");
          return;
        }
        const btn = document.getElementById("btn");
        btn.disabled = true;
        document.getElementById("log").innerHTML = "";
        lg(`${D.length} distributors ready. Connecting to MongoDB...`, "inf");
        try {
          const res = await fetch(
            `${base}/.netlify/functions/scc-distributors`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                action: "distSeedFromArray",
                payload: { records: D },
              }),
            },
          );
          const data = await res.json();
          if (!res.ok || !data.ok) {
            lg(`Error: ${data.error || res.statusText}`, "err");
            btn.disabled = false;
            return;
          }
          const { inserted, skipped } = data.result;
          lg("Migration complete.", "ok");
          lg(`  Inserted: ${inserted}`, "ok");
          lg(`  Skipped (already existed): ${skipped}`, "wrn");
          lg("scc_db.distributors is live. Delete this file.", "inf");
        } catch (e) {
          lg(`Network error: ${e.message}`, "err");
        }
        btn.disabled = false;
      }
    </script>
